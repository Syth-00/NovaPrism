<script type="module" src="script.js"></script>
<script type="module">
  import {
    requireLogin,
    logout,
    renderDashboard,
    renderAccounts,
    renderAddAccessChecks,
    applyAccessControl,
    renderSyncStatus,
    syncRekeningFromSheet,
    searchRekening,
    fetchRekeningCache,
    fetchAccountsConfig,
    saveAccountsConfig,
    clearLoginRecords,
    renderReportHistory,
    updateReportPreview,
    formatRupiahInputValue,
    getReportFieldsFromForm,
    generateReportText,
    saveReport,
    copyText,
    flashButton,
    renderKesalahanHistory,
    updateKesalahanPreview,
    formatNumberInputValue,
    getKesalahanFieldsFromForm,
    generateKesalahanText,
    saveKesalahanReport,
    menuLabel,
  } from "./script.js";

  (async () => {
    try {
      await requireLogin();
      await renderDashboard();
      await renderAccounts();
      await renderAddAccessChecks();
      await renderSyncStatus();

      // Sidebar navigation
      document.querySelectorAll(".nav-item").forEach(item => {
        item.addEventListener("click", () => {
          document.querySelectorAll(".nav-item").forEach(i => i.classList.remove("active"));
          document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
          item.classList.add("active");
          const viewEl = document.getElementById("view-" + item.dataset.view);
          if (viewEl) viewEl.classList.add("active");
          document.getElementById("pageLabel").textContent = menuLabel(item.dataset.view);
        });
      });

      document.querySelectorAll(".nav-group-header").forEach(header => {
        header.addEventListener("click", () => {
          header.closest(".nav-group").classList.toggle("collapsed");
        });
      });

      applyAccessControl();

      document.getElementById("logoutBtn").addEventListener("click", () => logout());

      document.getElementById("clearBtn").addEventListener("click", async () => {
        if (confirm("Hapus semua riwayat login?")) {
          await clearLoginRecords();
          await renderDashboard();
        }
      });

      document.getElementById("addAccountForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("newEmail").value.trim();
        const password = document.getElementById("newPassword").value;
        if (!email || !password) return;

        const access = Array.from(
          document.querySelectorAll("#newAccessChecks input:checked")
        ).map(i => i.value);
        if (access.length === 0) { alert("Pilih minimal satu menu."); return; }

        const list = await fetchAccountsConfig();
        if (list.find(x => x.email === email)) { alert("Email sudah ada."); return; }
        list.unshift({ email, access });
        await saveAccountsConfig(list);

        alert(`Akses untuk ${email} ditambahkan.\n\nJANGAN LUPA: buat akun di Firebase Console → Authentication → Users dengan email ${email} & password ${password}`);

        document.getElementById("newEmail").value = "";
        document.getElementById("newPassword").value = "";
        await renderAddAccessChecks();
        await renderAccounts();
      });

      document.getElementById("syncSheetBtn").addEventListener("click", () => syncRekeningFromSheet());
      document.getElementById("rekSearchBtn").addEventListener("click", () =>
        searchRekening(document.getElementById("rekSearchInput").value)
      );

      const cache = await fetchRekeningCache();
      if (!cache) syncRekeningFromSheet();

      // Report Bank
      await renderReportHistory();
      updateReportPreview();
      document.querySelectorAll("#view-report input, #view-report textarea").forEach(el => {
        if (el.id === "repSaldo") return;
        el.addEventListener("input", updateReportPreview);
      });
      document.getElementById("repSaldo").addEventListener("input", (e) => {
        e.target.value = formatRupiahInputValue(e.target.value);
        updateReportPreview();
      });
      document.getElementById("repCopyBtn").addEventListener("click", async (e) => {
        updateReportPreview();
        await copyText(document.getElementById("reportPreview").textContent);
        flashButton(e.target, "Tersalin!");
      });
      document.getElementById("repSaveBtn").addEventListener("click", async () => {
        const fields = getReportFieldsFromForm();
        await saveReport(fields, generateReportText(fields));
        await renderReportHistory();
      });
      document.getElementById("repResetBtn").addEventListener("click", () => {
        document.querySelectorAll("#view-report input, #view-report textarea").forEach(el => el.value = "");
        updateReportPreview();
      });

      // Report Kesalahan
      await renderKesalahanHistory();
      updateKesalahanPreview();
      document.querySelectorAll("#view-reportkesalahan input, #view-reportkesalahan textarea").forEach(el => {
        if (el.id === "rkNominal") return;
        el.addEventListener("input", updateKesalahanPreview);
      });
      document.getElementById("rkNominal").addEventListener("input", (e) => {
        e.target.value = formatNumberInputValue(e.target.value);
        updateKesalahanPreview();
      });
      document.getElementById("rkCopyBtn").addEventListener("click", async (e) => {
        updateKesalahanPreview();
        await copyText(document.getElementById("rkPreview").textContent);
        flashButton(e.target, "Tersalin!");
      });
      document.getElementById("rkSaveBtn").addEventListener("click", async () => {
        const fields = getKesalahanFieldsFromForm();
        await saveKesalahanReport(fields, generateKesalahanText(fields));
        await renderKesalahanHistory();
      });
      document.getElementById("rkResetBtn").addEventListener("click", () => {
        document.querySelectorAll("#view-reportkesalahan input, #view-reportkesalahan textarea").forEach(el => el.value = "");
        updateKesalahanPreview();
      });

    } catch (err) {
      console.error(err);
      document.body.innerHTML = `<div style="color:#fff;padding:40px;font-family:sans-serif;">Error: ${err.message}<br><br>Cek Console (F12).</div>`;
    }
  })();
</script>
